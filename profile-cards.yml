# Generates stats / languages / pin cards into ./profile and commits them.
# Replaces the public github-readme-stats.vercel.app instance, which is unreliable/paused.
# Optional: add a PAT secret named "PAT" (scopes: repo, read:user) to include private-repo stats.
name: Update profile cards

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      COMMON: username=${{ github.repository_owner }}&hide_border=true
    steps:
      - uses: actions/checkout@v6

      # ---------- Stats ----------
      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.COMMON }}&show_icons=true&include_all_commits=true&count_private=true&rank_icon=github&theme=github_dark
          path: profile/stats-dark.svg
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.COMMON }}&show_icons=true&include_all_commits=true&count_private=true&rank_icon=github&theme=default
          path: profile/stats-light.svg
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      # ---------- Top languages ----------
      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.COMMON }}&layout=compact&langs_count=6&theme=github_dark
          path: profile/top-langs-dark.svg
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.COMMON }}&layout=compact&langs_count=6&theme=default
          path: profile/top-langs-light.svg
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      # ---------- Pinned repos (duplicate these two steps per repo) ----------
      - name: Pin aCupOfTea (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: ${{ env.COMMON }}&repo=aCupOfTea&theme=github_dark
          path: profile/pin-aCupOfTea-dark.svg
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
      - name: Pin aCupOfTea (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: ${{ env.COMMON }}&repo=aCupOfTea&theme=default
          path: profile/pin-aCupOfTea-light.svg
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile cards" || exit 0
          git push
